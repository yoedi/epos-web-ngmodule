@if (loading) {
  <div class="cards" aria-hidden="true">
    @for (item of skeletonCards; track item) {
      <div class="card card--skeleton">
        <p-skeleton width="60%" height="var(--fs-row-name)" />
        <p-skeleton width="45%" height="var(--fs-caption)" />
        <p-skeleton width="35%" height="var(--fs-heading)" />
      </div>
    }
  </div>
} @else {
  <ul class="cards">
    @for (sale of sales; track sale.id) {
      <li>
        <button
          type="button"
          class="card"
          [attr.aria-label]="'Lihat ' + sale.invoiceNo"
          (click)="view.emit(sale)"
        >
          <span class="card__top">
            <span class="card__invoice invoice">{{ sale.invoiceNo }}</span>
            <i class="pi pi-chevron-right card__chevron" aria-hidden="true"></i>
          </span>
          <span class="card__meta">
            <span class="datetime">{{ sale.createdAt | date: 'd MMM y, HH:mm' : '+0700' }}</span>
            · {{ sale.cashierName }}
          </span>
          <span class="card__bottom">
            <span class="card__items"><span class="num">{{ sale.itemCount }}</span> barang</span>
            <span class="card__total money">{{ sale.total | rupiah }}</span>
          </span>
        </button>
      </li>
    }
  </ul>
}
