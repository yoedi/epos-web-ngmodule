<span
  class="badge"
  [class.badge--safe]="status === 'SAFE'"
  [class.badge--low]="status === 'LOW_STOCK'"
  [class.badge--out]="status === 'OUT_OF_STOCK'"
>
  @if (status === 'LOW_STOCK') {
    <i class="pi pi-exclamation-circle badge__icon" aria-hidden="true"></i>
  }
  {{ label }}
  @if (qty !== null) {
    <span class="num">{{ qty }}</span>
  }
</span>
